{{- $any := false }}
{{- range $k, $v := .Values.secrets }}{{- if $v }}{{ $any = true }}{{- end }}{{- end }}
{{- if $any }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secretName }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "organizzer.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.secrets }}
  {{- if $v }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  {{- end }}
{{- else }}
# Every entry under .Values.secrets is empty, so no Secret is rendered.
# Create it out of band with GITHUB_TOKEN and BERGET_API_KEY — every Deployment
# envFrom's it either way:
#
#   kubectl -n {{ .Values.namespace }} create secret generic {{ .Values.secretName }} \
#     --from-literal=GITHUB_TOKEN=... --from-literal=BERGET_API_KEY=...
#
# GITHUB_TOKEN needs a classic PAT with `repo` and `project`: ProjectsV2 lives
# in GraphQL and fine-grained tokens handle org projects awkwardly.
{{- end }}
